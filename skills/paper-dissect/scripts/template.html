*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
/* ---------- top bar ---------- */
.top{display:grid;grid-template-columns:minmax(260px,auto) minmax(0,1fr);gap:8px 28px;align-items:center;padding:10px 16px;background:var(--pane);border-bottom:1px solid var(--rule)}
.top h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.top h1 small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px}
.cov{display:flex;flex-direction:column;gap:4px;min-width:0}
.cov .bar{display:flex;height:9px;border-radius:2px;overflow:hidden;background:var(--rule-soft)}
.cov .bar i{display:block;height:100%}
.cov .lbl{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cov .lbl b{color:var(--ink);font-weight:500}
.cov .lbl i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.controls{grid-column:1 / -1;display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;justify-content:flex-start;padding-top:4px;border-top:1px solid var(--rule-soft)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{padding:4px 9px;font-size:12px;color:var(--muted);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--ink);font-weight:500}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
.chk i{display:inline-block;width:14px;height:0;border-top:2px solid currentColor}
.chk.off{opacity:.4;text-decoration:line-through}
/* ---------- panes ---------- */
.panes{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(480px,1.9fr) minmax(300px,.95fr);gap:1px;background:var(--rule);min-height:0}
.pane{background:var(--pane);min-height:0;display:flex;flex-direction:column}
.pane > header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:8px 14px;border-bottom:1px solid var(--rule);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.src h2,.src h3{font-family:var(--ui);font-weight:600;margin:22px 0 6px;letter-spacing:-.01em}
.src h2{font-size:14px}.src h3{font-size:12.5px;color:var(--muted)}
.src .num{color:var(--faint);font-weight:400;margin-right:6px;font-family:var(--mono);font-size:11px}
.sent{display:block;padding:1px 6px 1px 9px;border-left:3px solid var(--rule-soft);margin:1px 0;cursor:pointer;border-radius:0 3px 3px 0}
.sent:hover{background:var(--hover)}

/* ---------- graph pane ---------- */
.tabs{display:inline-flex;gap:2px;border:1px solid var(--rule);border-radius:6px;overflow:hidden;letter-spacing:0;text-transform:none}
.tabs[hidden]{display:none}
.tabs button{padding:3px 10px;font-size:12px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--sel);color:var(--ink);font-weight:500}
.gbar{display:flex;flex-direction:column;gap:2px;padding:8px 14px;border-bottom:1px solid var(--rule-soft);background:var(--pane)}
.gcrumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11.5px;color:var(--faint)}
.gcrumb button{color:var(--accent);padding:1px 4px;border-radius:3px}
.gcrumb button:hover{background:var(--hover)}
.gcrumb button.cur{color:var(--ink);font-weight:500}
.gtitle{font-size:11.5px;color:var(--muted)}
svg.graph{display:block;font-family:var(--ui)}
svg.graph g.edges path{fill:none;stroke-width:1.4;opacity:.7}
svg.graph g.edges path.via{stroke-dasharray:3 3}
svg.graph g.edges path.inf{stroke-dasharray:1.5 3}
svg.graph g.edges path.hi{opacity:1;stroke-width:2.2}
svg.graph g.edges path.lo{opacity:.1}
svg.graph g.gn{cursor:pointer}
svg.graph g.gn rect{fill:var(--pane);stroke:var(--rule);stroke-width:1}
svg.graph g.gn rect.stripe{fill:var(--rc);stroke:none}
svg.graph g.gn.port rect{stroke-dasharray:3 2;fill:var(--ground)}
svg.graph g.gn.on rect:not(.stripe){stroke:var(--accent);stroke-width:2}
svg.graph g.gn.focal rect:not(.stripe){stroke:var(--rc);stroke-width:2}
svg.graph g.gn.lo{opacity:.25}
svg.graph g.gn.dirty rect:not(.stripe){fill:var(--dirty)}
svg.graph g.gn:hover rect:not(.stripe){stroke:var(--accent)}
svg.graph text{fill:var(--ink);font-size:11.5px}
svg.graph text.chip{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--rc)}
svg.graph text.bd{font-size:9px;fill:var(--muted)}
svg.graph text.dr{font-size:9.5px;fill:var(--accent);font-weight:500}
svg.graph text.fn{font-size:8.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
svg.graph text.colhead{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;fill:var(--faint)}
svg.graph g.gn.aside rect:not(.stripe){stroke-dasharray:2 2}
svg.graph g.gn.aside text.lab{fill:var(--muted)}
svg.graph g.gn.port text.lab{fill:var(--muted)}

.focus{padding:12px 16px 40px;font-size:13px}
.crumb{font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.5}
.crumb b{color:var(--ink);font-weight:500}
.focus h2{font-size:15px;line-height:1.3;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
.focus .role{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#fff;background:var(--rc);padding:1px 6px;border-radius:3px;margin-right:6px}
.focus .where{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.focus p.stmt{font-family:var(--serif);font-size:14px;line-height:1.5;margin:10px 0 12px}
.focus h3{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;font-weight:600}
.spanlist{margin:0;padding:0;list-style:none;font-family:var(--serif);font-size:13px;line-height:1.5}
.spanlist li{padding:3px 8px;border-left:2px solid var(--rc);margin:3px 0;cursor:pointer}
.spanlist li:hover{background:var(--hover)}

.edgelist .en{cursor:pointer}
.edgelist .en:hover{text-decoration:underline}
.edgelist .ev{grid-column:2;font-family:var(--serif);font-size:12px;color:var(--muted);font-style:italic;line-height:1.45}

.lineage{font-size:12.5px}
.lineage .lvl{display:flex;gap:6px;align-items:flex-start;margin:4px 0}
.lineage .lvl .d{flex:none;width:34px;font-family:var(--mono);font-size:10px;color:var(--faint);padding-top:3px}
.lineage .lvl .items{display:flex;flex-wrap:wrap;gap:4px}
.lineage .it{border:1px solid var(--rule);border-left:3px solid var(--rc);border-radius:3px;padding:1px 6px;cursor:pointer;background:var(--pane);font-size:12px;max-width:100%}
.lineage .it:hover{background:var(--hover)}

.whatif button{padding:4px 10px;border:1px solid var(--rule);border-radius:5px;background:var(--pane);font-size:12px}
.whatif button[aria-pressed="true"]{background:var(--dirty);color:var(--dirty-ink);border-color:var(--dirty-ink)}

@media (max-width:1100px){.panes{grid-template-columns:1fr 1fr}.pane.p-src{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
<header class="top">
  <h1 id="ptitle">Paper, dissected<small id="psub"></small></h1>
  <div class="cov" id="cov"></div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Fold level">
      <button data-fold="sections" aria-pressed="false" title="Show only sections (quotient at section level)">Sections</button>
      <button data-fold="paper" aria-pressed="true" title="Sections + nodes, proofs folded">Ideas</button>
      <button data-fold="all" aria-pressed="false" title="Everything unfolded, including proof steps">Steps</button>
    </div>
    <div id="etypes" role="group" aria-label="Edge types"></div>

    <label class="chk off" id="asidesChk" title="Show interpretations and comparisons on the narrative storyline"><i style="color:var(--muted)"></i>asides</label>
    <label class="chk off" id="problemsChk" title="Show the motivating problems as their own column in the inquiry view"><i style="color:var(--muted)"></i>problems as nodes</label>
    <div class="seg" role="group" aria-label="Storyline order"><button data-story="inquiry" aria-pressed="true" title="Question → refinements → answers → contributions">Inquiry</button><button data-story="narrative" aria-pressed="false" title="Problem → goal → approach → guarantee → evaluation → evidence → contribution">Narrative</button></div>
  </div>

  </section>
</div>

<script id="graph-data" type="application/json">/*GRAPH_JSON*/</script>
<script>
(() => {
const G = JSON.parse(document.getElementById('graph-data').textContent);
const S = new Map(G.sentences.map(s => [s.id, s]));
const ORDER = G.sentences.map(s => s.id);
const POS = new Map(ORDER.map((id, i) => [id, i]));
const N = new Map(G.nodes.map(n => [n.id, n]));
const isStory = id => { const n = N.get(id); return !!n && !!n.story; };
const SEC = new Map(G.sections.map(s => [s.id, s]));
const ROLE_LABEL = {question:'target', claim:'claim', theorem:'result', derived:'derived', hypothesis:'hypoth', step:'step', proof:'proof', experiment:'observed', method:'method', assumption:'assume', definition:'def', background:'cited', limitation:'limit'};
const ETYPES = ['refines','motivates','answered_by','requires','uses','entails','supports','proves','qualifies','contrasts','instantiates'];
const ETYPE_LABEL = {refines:'refines', motivates:'motivates', answered_by:'answered by', requires:'requires', uses:'uses', entails:'entails', supports:'supports', proves:'proves', qualifies:'qualifies', contrasts:'contrasts', instantiates:'instantiates'};
const DEP_TYPES = new Set(['requires','uses','entails','supports','proves','instantiates']); // dependency semantics for what-if (narrative edges excluded)

// ---------- derived structure ----------
for (const n of G.nodes) n.pos = Math.min(...n.spans.map(s => POS.get(s)));
for (const s of G.sections) s.pos = POS.get(s.start);
const childrenOf = new Map();
function addChild(p, c) { if (!childrenOf.has(p)) childrenOf.set(p, []); childrenOf.get(p).push(c); }
for (const s of G.sections) if (s.parent) addChild(s.parent, {sec: s});
for (const n of G.nodes) addChild(n.parent, {node: n});
for (const [k, arr] of childrenOf) arr.sort((a, b) => (a.sec ? a.sec.pos : a.node.pos) - (b.sec ? b.sec.pos : b.node.pos));
const roots = G.sections.filter(s => !s.parent);
function parentOf(id) { return N.has(id) ? N.get(id).parent : SEC.get(id).parent; }

  const dirty = state.whatIf && state.selected ? downstream(state.selected) : new Set();
  const defs = `<defs>${ETYPES.map(t => `<marker id="gm-${t}" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.5 L8,4 L0,7.5 z" fill="${edgeColor(t)}"/></marker>`).join('')}</defs>`;
  const heads = view.column ? cols.map((c, i) => c.length ? `<text class="colhead" x="${20 + i * (W + 44)}" y="18">${(view.colTitles || COL_TITLE)[i] || ''}</text>` : '').join('') : '';
  const eds = view.edges.map(e => {
    const a = xy.get(e.from), b = xy.get(e.to); if (!a || !b) return '';
    const back = b.x < a.x + 10;
    const x1 = back ? a.x : a.x + W, y1 = a.y + H / 2, x2 = back ? b.x + W : b.x, y2 = b.y + H / 2;
    const same = Math.abs(b.x - a.x) < 5;
    let d;
    if (same) { const bul = 40; d = `M ${a.x + W} ${y1} C ${a.x + W + bul} ${y1}, ${b.x + W + bul} ${y2}, ${b.x + W} ${y2}`; }
    else if (back) { d = `M ${x1} ${y1} C ${x1 - 50} ${y1}, ${x2 + 50} ${y2}, ${x2} ${y2}`; }
    else { const dx = Math.max(30, (x2 - x1) / 2); d = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`; }
    const cls = [e.via ? 'via' : '', e.basis === 'inferred' ? 'inf' : '', hi.size ? ((hi.has(e.from) && hi.has(e.to)) ? 'hi' : 'lo') : ''].join(' ');
    return `<path d="${d}" class="${cls}" stroke="${edgeColor(e.type)}" marker-end="url(#gm-${e.type})"><title>${ETYPE_LABEL[e.type]}${e.via ? ` (through ${e.via} hidden node${e.via > 1 ? 's' : ''})` : ''}${e.basis === 'inferred' ? ' · inferred' : ''}: ${labelOf(e.from)} → ${labelOf(e.to)}</title></path>`;
  }).join('');
  const nds = view.nodes.map(id => {
    const n = N.get(id); const p = xy.get(id); const port = view.ports.has(id);
    const lines = wrap(n.label, W > 190 ? 30 : 28, 2);
    const chip = chipOf(n);
    const fn = n.kind !== 'target' && (view.badge || view.focal) && n.function && !['setup', 'guarantee', 'evidence', 'context'].includes(n.function) ? (FUNC_LABEL[n.function] || n.function) : (n.function === 'context' ? 'context' : '');
    let bd = view.badge && n.role === 'claim' ? badges(id) : (n.role === 'proof' ? `${(childrenOf.get(id) || []).length} steps` : (n.role === 'theorem' && (childrenOf.get(id) || []).length ? 'has proof' : ''));
    if (view.inquiry && n.kind === 'target' && !state.problems) { const ps = problemsOf(id); if (ps.length) bd = 'because: ' + ps.map(p => N.get(p).label.replace(/^Problem \d+ — /, '')).join('; '); }
    const bdMax = drillKind(id) ? 26 : 34; if (bd && bd.length > bdMax) bd = bd.slice(0, bdMax - 1) + '…';
    const canOpen = drillKind(id) && (!port || N.get(id).role === 'theorem');
    const cls = ['gn', port ? 'port' : '', n.aside ? 'aside' : '', hi.size ? (hi.has(id) ? 'hi' : 'lo') : '', id === graphSel ? 'on' : '', dirty.has(id) ? 'dirty' : '', drillKind(id) ? 'drill' : '', id === view.focal ? 'focal' : ''].join(' ');
    return `<g class="${cls}" transform="translate(${p.x},${p.y})" data-id="${id}" style="--rc:${roleColor(n.role)}"><rect width="${W}" height="${H}" rx="5"/><rect class="stripe" width="4" height="${H}" rx="2"/><text class="chip" x="12" y="13">${chip}</text>${fn && !port ? `<text class="fn" x="${W - 8}" y="13" text-anchor="end">${fn}</text>` : ''}${port && !canOpen ? `<text class="fn" x="${W - 8}" y="${H - 8}" text-anchor="end">↗ elsewhere</text>` : ''}${lines.map((l, i) => `<text class="lab" x="12" y="${28 + i * 13}">${esc(l)}</text>`).join('')}${bd ? `<text class="bd" x="12" y="${H - 8}">${esc(bd)}</text>` : ''}${canOpen ? `<text class="dr" x="${W - 8}" y="${H - 8}" text-anchor="end">open ▸</text>` : ''}<title>${esc(n.text || n.label)}</title></g>`;
  }).join('');
  svg.innerHTML = defs + heads + `<g class="edges">${eds}</g><g class="nodes">${nds}</g>`;
  svg.querySelectorAll('g.gn').forEach(g => {
    g.addEventListener('click', ev => { const id = g.dataset.id; if (ev.target.classList.contains('dr')) { drill(id); return; } graphSel = id; state.selected = id; for (const a of ancestors(id)) state.expanded.add(a); renderGraph(); renderFocus(); revealSource(id); });
    g.addEventListener('dblclick', () => drill(g.dataset.id));
  });
  document.getElementById('gcrumb').innerHTML = graphStack.map((g, i) => `<button data-i="${i}" ${i === graphStack.length - 1 ? 'class="cur"' : ''}>${esc(g.kind === 'story' ? 'Storyline' : g.title)}</button>`).join('<span>›</span>');
  document.getElementById('gcrumb').querySelectorAll('button').forEach(b => b.addEventListener('click', () => popTo(+b.dataset.i)));
  const hiddenAsides = view.badge && !state.asides ? G.nodes.filter(n => n.story && n.aside).length : 0;
  document.getElementById('graphinfo').textContent = `${view.nodes.length} nodes · ${view.edges.length} relations${view.badge && state.reduce ? ' · reduced' : ''}${hiddenAsides ? ` · ${hiddenAsides} asides hidden` : ''}`;
  document.getElementById('gtitle').textContent = view.title;
}

// ---------- tabs ----------
function showTab(name) {
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === name)));
  document.querySelectorAll('[data-tabpane]').forEach(p => p.hidden = p.dataset.tabpane !== name);
  document.getElementById('graphinfo').hidden = name !== 'graph'; document.getElementById('scoreinfo').hidden = name !== 'score';
  if (name === 'score') requestAnimationFrame(drawArcs); else renderGraph();
}
// ---------- init ----------
state.reduce = true; state.asides = false; state.problems = false; state.storyMode = 'inquiry'; state.group = 'ideas';
graphStack.push({kind: 'story', id: null, title: 'Story'});
renderCoverage(); renderEtypes(); applyFold('paper'); renderSource(); renderRows(); renderFocus(); renderGraph();
document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
document.getElementById('reduceChk').addEventListener('click', () => { state.reduce = !state.reduce; document.getElementById('reduceChk').classList.toggle('off', !state.reduce); renderGraph(); });
document.getElementById('asidesChk').addEventListener('click', () => { state.asides = !state.asides; document.getElementById('asidesChk').classList.toggle('off', !state.asides); renderGraph(); });
document.querySelectorAll('[data-group]').forEach(b => b.addEventListener('click', () => { state.group = b.dataset.group; document.querySelectorAll('[data-group]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); applyFold(state.fold); renderRows(); }));
document.getElementById('problemsChk').addEventListener('click', () => { state.problems = !state.problems; document.getElementById('problemsChk').classList.toggle('off', !state.problems); renderGraph(); });
document.querySelectorAll('[data-story]').forEach(b => b.addEventListener('click', () => { state.storyMode = b.dataset.story; document.querySelectorAll('[data-story]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); popTo(0); }));
document.querySelectorAll('[data-fold]').forEach(b => b.addEventListener('click', () => { applyFold(b.dataset.fold); renderRows(); }));
new ResizeObserver(() => drawArcs()).observe(document.getElementById('rows'));
window.addEventListener('resize', drawArcs);
document.getElementById('srcinfo').textContent = `${G.sentences.length} sentence-level units`;
document.getElementById('ptitle').firstChild.textContent = (G.meta.title || 'Paper') + ', dissected';
document.getElementById('psub').textContent = `${G.meta.arxiv ? 'arXiv ' + G.meta.arxiv + ' · ' : ''}every unit through ${G.meta.dissected_through} assigned · storyline → evidence → proof, or the same graph in source order`;
document.title = (G.meta.title || 'Paper') + ' — dissected';
document.addEventListener('keydown', e => { if (e.key === 'Escape') { state.selected = null; selectedEdge = null; state.whatIf = false; renderRows(); renderFocus(); } });
})();
</script>
